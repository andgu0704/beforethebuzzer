name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Simulation smoke run
        run: npm run sim -- --careers 2 --seasons 1 --seed ci --out ${{ runner.temp }}/balance
