name: iOS screenshots

# Builds a release app for the iOS Simulator and runs the Maestro flows, uploading the
# screenshots. Runs from the Actions tab, or when this workflow or the flows change.
# macOS runners are free on public repositories.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/ios-screens.yml'
      - '.maestro/**'

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: 'iPhone 17 Pro Max'
            appearance: light
            textSize: large
          - device: 'iPhone 17e'
            appearance: dark
            textSize: accessibility-extra-extra-extra-large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot the simulator
        run: |
          # The same name exists under several runtimes; take the newest one.
          UDID=$(xcrun simctl list devices available -j | jq -r --arg name "${{ matrix.device }}" \
            '[.devices | to_entries | sort_by(.key)[] | select(.key | test("iOS")) | .value[] | select(.name == $name)] | last | .udid')
          echo "Simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance ${{ matrix.appearance }}
          xcrun simctl ui "$UDID" content_size ${{ matrix.textSize }}
      - name: Build and install a release build
        run: |
          set -o pipefail
          npx expo run:ios --configuration Release --device "$UDID" --no-bundler 2>&1 | tee build.log
        env:
          CI: '1'
      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|❌|fatal|Error:|failed" build.log | grep -v "Explicit dependency" | head -80 || true
          grep -n -A12 "Could not resolve package dependencies" build.log | head -40 || true
          grep -n -B6 -A4 "❌" build.log | head -60 || true
      - name: Run the flows
        run: maestro --device "$UDID" test .maestro --test-output-dir maestro-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.device }}-${{ matrix.appearance }}-${{ matrix.textSize }}
          path: |
            build.log
            maestro-output
            *.png
            .maestro/*.png
