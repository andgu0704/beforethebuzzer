name: iOS screenshots

# Builds a release app for the iOS Simulator and runs the Maestro flows, uploading the
# screenshots. Runs from the Actions tab, or when this workflow or the flows change.
# macOS runners are free on public repositories.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/ios-screens.yml'
      - '.maestro/**'

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: 'iPhone 16 Pro Max'
            appearance: light
            textSize: large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ matrix.device }}" || true
          xcrun simctl bootstatus "${{ matrix.device }}" -b
          xcrun simctl ui "${{ matrix.device }}" appearance ${{ matrix.appearance }}
          xcrun simctl ui "${{ matrix.device }}" content_size ${{ matrix.textSize }}
      - name: Build and install a release build
        run: |
          set -o pipefail
          npx expo run:ios --configuration Release --device "${{ matrix.device }}" --no-bundler 2>&1 | tee build.log
        env:
          CI: '1'
      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|❌|fatal|Error:|failed" build.log | grep -v "Explicit dependency" | head -80 || true
      - name: Run the flows
        run: maestro test .maestro --test-output-dir maestro-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.device }}-${{ matrix.appearance }}-${{ matrix.textSize }}
          path: |
            build.log
            maestro-output
            *.png
            .maestro/*.png
