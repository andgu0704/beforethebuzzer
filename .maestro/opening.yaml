# Creates a career, plays the first game on the live screen, spends a skill point and visits
# every tab, taking screenshots on the way.
appId: app.beforethebuzzer
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: new-career
    timeout: 30000
- takeScreenshot: welcome
- tapOn:
    id: new-career
- tapOn:
    id: given
- inputText: Nika
# Return moves on to the family name, which is under the keyboard at the largest text sizes.
- pressKey: Enter
- inputText: Beridze
# Return on the family name closes the keyboard (hideKeyboard is unreliable on iOS).
- pressKey: Enter
- takeScreenshot: create-who
- repeat:
    times: 5
    commands:
      - tapOn:
          id: create-next
- tapOn:
    id: create-next
- extendedWaitUntil:
    visible:
      id: next-week
    timeout: 60000
- takeScreenshot: home-first
# The first game: pre-game, tip-off, watch, any key moment, the final.
- tapOn:
    id: next-week
- extendedWaitUntil:
    visible:
      id: tip-off
    timeout: 30000
- takeScreenshot: pregame
- tapOn:
    id: approach-score
- tapOn:
    id: tip-off
- extendedWaitUntil:
    visible:
      id: live-board
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: live
- repeat:
    while:
      notVisible:
        id: live-final
    commands:
      - runFlow:
          when:
            visible:
              id: 'moment-(?!continue).*'
          commands:
            - takeScreenshot: moment
            - tapOn:
                id: 'moment-(?!continue).*'
                index: 0
            - waitForAnimationToEnd:
                timeout: 4000
            - tapOn:
                id: moment-continue
      - runFlow:
          when:
            visible:
              id: live-skip
          commands:
            - tapOn:
                id: live-skip
      - waitForAnimationToEnd:
          timeout: 2000
- takeScreenshot: final
- tapOn:
    id: live-done
- extendedWaitUntil:
    visible:
      id: next-week
    timeout: 30000
- takeScreenshot: home-after-game
# Spend a skill point.
- tapOn:
    id: tab-train
- takeScreenshot: train
- tapOn:
    id: upgrade-shooting
- takeScreenshot: train-upgraded
- tapOn:
    id: tab-team
- takeScreenshot: team
- tapOn:
    id: tab-career
- takeScreenshot: career
- tapOn:
    id: tab-social
- takeScreenshot: social
