# Creates a career, plays the first game on the live screen, spends a skill point, visits
# every tab and opens Settings from the profile, taking screenshots on the way.
appId: app.beforethebuzzer
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: new-career
    timeout: 30000
- takeScreenshot: welcome
- tapOn:
    id: new-career
- tapOn:
    id: given
- inputText: Nika
# Return moves on to the family name, which is under the keyboard at the largest text sizes.
- pressKey: Enter
- inputText: Beridze
# Return on the family name closes the keyboard (hideKeyboard is unreliable on iOS).
- pressKey: Enter
- takeScreenshot: create-who
- repeat:
    times: 5
    commands:
      - tapOn:
          id: create-next
- tapOn:
    id: create-next
- extendedWaitUntil:
    visible:
      id: next-week
    timeout: 60000
- takeScreenshot: home-first
# The first game: pre-game, tip-off, watch, any key moment, the final.
- tapOn:
    id: next-week
- extendedWaitUntil:
    visible:
      id: tip-off
    timeout: 30000
- takeScreenshot: pregame
# At the largest text sizes the approaches are below the fold.
- scrollUntilVisible:
    element:
      id: approach-score
    direction: DOWN
- tapOn:
    id: approach-score
- tapOn:
    id: tip-off
# The live screen: the board, or a key moment straight away (it hides the board).
- extendedWaitUntil:
    visible:
      id: live-line
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: live
- repeat:
    while:
      notVisible:
        id: live-final
    commands:
      - runFlow:
          when:
            visible:
              id: key-moment
          commands:
            - takeScreenshot: moment
            # At the largest text sizes the options, the meter and Continue are below the fold.
            - scrollUntilVisible:
                element:
                  id: 'moment-(?!continue).*'
                direction: DOWN
            - tapOn:
                id: 'moment-(?!continue).*'
                index: 0
            # The skill check, unless the move has nothing to time (playing hurt).
            - scrollUntilVisible:
                element:
                  id: skill-release
                direction: DOWN
                timeout: 3000
                optional: true
            - takeScreenshot: skill-check
            - tapOn:
                id: skill-release
                optional: true
            - waitForAnimationToEnd:
                timeout: 4000
            - scrollUntilVisible:
                element:
                  id: moment-continue
                direction: DOWN
            - tapOn:
                id: moment-continue
      - runFlow:
          when:
            visible:
              id: live-skip
          commands:
            - tapOn:
                id: live-skip
      - waitForAnimationToEnd:
          timeout: 2000
- takeScreenshot: final
- scrollUntilVisible:
    element:
      id: live-done
    direction: DOWN
- tapOn:
    id: live-done
- extendedWaitUntil:
    visible:
      id: next-week
    timeout: 30000
- takeScreenshot: home-after-game
# Spend a skill point.
- tapOn:
    id: tab-train
- takeScreenshot: train
- scrollUntilVisible:
    element:
      id: upgrade-shooting
    direction: DOWN
- tapOn:
    id: upgrade-shooting
- takeScreenshot: train-upgraded
- tapOn:
    id: tab-team
- takeScreenshot: team
- tapOn:
    id: tab-career
- takeScreenshot: career
- tapOn:
    id: tab-social
- takeScreenshot: social
# The profile, then Settings, where the skill check can be switched off.
- tapOn:
    id: tab-home
- tapOn:
    id: open-profile
- extendedWaitUntil:
    visible:
      id: profile
    timeout: 15000
- takeScreenshot: profile
- scrollUntilVisible:
    element:
      id: profile-settings
    direction: DOWN
- tapOn:
    id: profile-settings
- extendedWaitUntil:
    visible:
      id: settings
    timeout: 15000
- scrollUntilVisible:
    element:
      id: skill-checks
    direction: DOWN
- takeScreenshot: settings
